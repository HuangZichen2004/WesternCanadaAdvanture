<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#193f35">
<title>枫行 · 加拿大旅行手记</title>
<style>
:root{
  --bg:#f5f4ee;--paper:#fffefa;--ink:#253c33;--muted:#81867a;
  --green:#193f35;--light:#eaf0e7;--red:#b95642;--line:#e6e7dd;
  --shadow:0 12px 40px #223e3308
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);position:relative;
  font-family:"Palatino Linotype","Source Han Serif SC Heavy",serif}
.background-layer{position:fixed;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:-2}
.background-layer.active{opacity:1}
body>header,body>.hero,body>.layout,body>footer{position:relative;z-index:0}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,a:focus-visible,summary:focus-visible{
  outline:3px solid #d29464;outline-offset:4px
}
button{color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.topbar{
  max-width:1280px;margin:auto;padding:14px 36px;
  display:flex;align-items:center;justify-content:flex-start;gap:16px
}
.auth-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.auth-status{font-size:11px;color:var(--muted)}
.flag-mark{display:block;width:40px;height:20px;object-fit:cover;border-radius:3px;box-shadow:0 2px 8px #193f3524}
.brand{display:flex;gap:10px;align-items:center;font-size:21px;font-weight:750}
.brand span{font-size:27px}
.brand small{font-size:10px;letter-spacing:2px;font-weight:500;display:block;margin-top:3px}
.top-actions{display:flex;gap:8px}
.btn{
  border:1px solid var(--line);background:var(--paper);border-radius:10px;
  padding:10px 14px;font-size:12px;transition:.18s
}
.btn:hover{background:var(--light);border-color:#c4d1c1}
.btn.primary{background:var(--green);color:white;border-color:var(--green)}
.hero{
  position:relative;overflow:hidden;width:calc(100% - 72px);max-width:1208px;margin:0 auto;
  min-height:108px;border-radius:22px;background:#ffffff80;color:#253c33;
  backdrop-filter:blur(10px);border:1px solid #ffffff9c;
  padding:17px 42px;isolation:isolate
}
.hero-art{display:none}
.eyebrow{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-style:italic;font-weight:700;letter-spacing:2px;color:#000}
.hero-bottom{display:flex;align-items:center;gap:24px;margin-top:10px;font-size:12px;color:#526255;flex-wrap:nowrap}
.hero-bottom i{width:4px;height:4px;border-radius:50%;background:#c38363}
.layout{width:100%;max-width:1280px;margin:30px auto 0;padding:0 36px;display:grid;grid-template-columns:225px 1fr;gap:38px;align-items:start}
.sidebar{position:sticky;top:18px;background:#ffffff55;border:1px solid #ffffff60;border-radius:18px;padding:10px 16px 10px 8px;backdrop-filter:blur(10px)}
.nav-label{font-size:10px;letter-spacing:2px;color:var(--muted);padding:6px 14px 16px}
.days{display:flex;flex-direction:column;gap:5px}
.day-btn{
  border:0;background:transparent;text-align:left;border-radius:12px;
  padding:13px 14px;display:grid;grid-template-columns:49px 1fr;gap:10px;
  align-items:center;width:100%;transition:.18s
}
.day-btn:hover{background:#eceee5}
.day-btn.active{background:var(--light);color:var(--ink);box-shadow:0 7px 18px #193f3514}
.day-date{font-size:15px;font-weight:700}
.day-date small{display:block;font-size:10px;font-weight:400;opacity:.65;margin-top:3px}
.day-place{font-size:12px;line-height:1.5}
.day-place small{display:block;font-size:10px;opacity:.6}
.main{min-width:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-radius:10px}
::-webkit-scrollbar-thumb{background:#ffffffb8;border:1px solid #ffffffd9;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#fff}
*{scrollbar-color:#ffffffb8 #ffffff54;scrollbar-width:thin}
@media(min-width:801px){
  body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
  .topbar,.hero{flex-shrink:0}
  .layout{flex:1 1 auto;min-height:0;height:auto;overflow:hidden;margin-bottom:20px}
  .sidebar{position:relative;top:auto;align-self:stretch;min-height:0;overflow:visible;display:flex;flex-direction:column}
  .sidebar .days{flex:1;min-height:0;overflow-y:auto;padding-right:8px;scrollbar-gutter:stable;width:calc(100% + 8px)}
  .main{
    height:100%;min-height:0;overflow:visible;padding:0
  }
  footer{display:none}
}
.day-panel{background:#ffffff70;border:1px solid #ffffff68;border-radius:18px;height:100%;min-height:0;overflow:hidden;backdrop-filter:blur(10px)}
.day-panel-scroll{height:calc(100% - 16px);width:calc(100% - 8px);margin:8px 0;overflow-y:auto;overscroll-behavior:contain;padding:22px 20px 26px}
.day-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin:4px 0 22px}
.kicker{font-size:10px;letter-spacing:2px;color:var(--red);font-weight:650;margin-bottom:8px}
h2{font-size:29px;line-height:1.3;margin:0;font-weight:500}
.route{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
.budget{text-align:right;flex-shrink:0;padding-top:4px}
.budget small{display:block;font-size:10px;color:var(--muted);margin-bottom:7px}
.budget strong{font-size:22px;font-weight:500}
.currency-line{display:block}
.day-note{padding:11px 15px;background:#eeeade;color:#897146;font-size:12px;line-height:1.7;border-radius:10px;margin-bottom:18px}
.note-actions{float:right;display:flex;gap:6px;margin-left:12px}
.note-action{border:0;background:transparent;color:#a3834e;font-size:11px;padding:2px 4px}
.note-action:hover{color:var(--red)}
.note-form{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-bottom:18px}
.note-toggle{display:flex;align-items:center;gap:8px;width:max-content;border:1px dashed #d2bd8f;background:transparent;color:#a3834e;border-radius:9px;padding:8px 12px;font-size:11px;margin-bottom:18px}
.note-toggle:hover{background:#f5edda;border-color:#b99a60}
.note-icon{font-size:16px;line-height:1;color:#c38322}
.timeline{position:relative}
.timeline:before{content:"";position:absolute;left:17px;top:15px;bottom:28px;width:1px;background:#d7dfd2}
.step{position:relative;display:grid;grid-template-columns:35px minmax(0,1fr);gap:13px;margin-bottom:14px}
.step-number{
  width:35px;height:35px;border-radius:50%;background:var(--bg);
  border:1px solid #d7dfd2;display:grid;place-items:center;
  font-size:11px;color:#687b65;margin-top:20px;z-index:1
}
.step.stay .step-number{background:#e7ece2}
.card{border:1px solid #ffffffa8;background:#fffefad1;border-radius:15px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(8px)}
.card-top{display:flex;gap:12px;align-items:flex-start;padding:20px 20px 13px}
.edit-step-form{display:grid;grid-template-columns:1fr 180px auto auto;gap:9px;padding:16px 20px}
.card-info{flex:1;min-width:0}
.step-meta{font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{background:#f3e8de;color:#986348;padding:3px 7px;border-radius:5px;letter-spacing:0}
.step-title{font-size:15px;line-height:1.6;font-weight:550;overflow-wrap:anywhere}
.card-actions{display:flex;gap:4px;flex-shrink:0}
.location-form{display:flex;gap:8px;padding:0 20px 14px}
.location-form .text-input{flex:1}
.location-btn{border:0;background:transparent;color:#687b65;padding:5px 6px;font-size:11px;border-radius:6px;white-space:nowrap}
.location-btn:hover{background:var(--light);color:var(--green)}
.location-btn.go{background:var(--red);color:#fff;padding:6px 11px;font-weight:700}
.location-btn.go:hover{background:#963d31;color:#fff}
.icon-btn{border:0;background:transparent;color:#8a9084;padding:5px 6px;font-size:11px;border-radius:6px}
.icon-btn:hover{background:var(--light);color:var(--green)}
.icon-btn.danger:hover{background:#f6e7e1;color:var(--red)}
.tools{border-top:1px solid #f0f0e9}
.tools summary{
  list-style:none;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;gap:10px;padding:12px 20px;font-size:11px;color:var(--muted)
}
.tools summary::-webkit-details-marker{display:none}
.tools summary:hover{background:#f9faf5}
.tool-label:before{content:"＋";margin-right:6px;color:var(--green)}
.tools[open] .tool-label:before{content:"－"}
.step-summary{color:#688064;font-size:11px}
.tool-body{padding:5px 20px 18px}
.tool-controls{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.field-label{font-size:11px;color:var(--muted);display:block;margin-bottom:7px}
.cost-field{
  display:flex;align-items:center;flex-wrap:wrap;border:1px solid var(--line);
  border-radius:9px;background:#fff;overflow:hidden
}
.cost-field span{font-size:11px;color:#7d8976;padding-left:12px}
.cost-field input{width:130px;border:0;outline:none;background:transparent;padding:10px}
.cost-field:focus-within{border-color:#799477}
.aa-field{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--muted)}
.cost-field .aa-field{flex-basis:100%;padding:0 10px 8px;margin-top:0}
.aa-field input{width:auto;padding:0;accent-color:var(--green)}
.aa-field select{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:4px 6px;font-size:11px;color:var(--ink)}
.aa-field select:disabled{opacity:.45}
.aa-summary{font-size:11px;color:#687b65;line-height:1.7}
.photos{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.photo-wrap{position:relative;width:91px;height:78px}
.thumb{padding:0;width:100%;height:100%;border:0;border-radius:8px;overflow:hidden;background:var(--light)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.thumb:hover img{transform:scale(1.06)}
.remove-photo{
  position:absolute;right:-5px;top:-5px;border:2px solid var(--paper);
  background:#4a5147;color:white;border-radius:50%;width:21px;height:21px;
  font-size:12px;padding:0;line-height:16px
}
.add-box{margin:20px 0 0 48px;padding:20px;border:1px dashed #c7d1bf;border-radius:14px}
.add-box h3{font-size:12px;margin:0 0 13px;font-weight:550}
.add-form{display:grid;grid-template-columns:1fr 125px auto;gap:9px}
.insert-row{position:relative;z-index:1;display:grid;grid-template-columns:35px minmax(0,1fr);gap:13px;margin:2px 0}
.insert-toggle{
  border:0;background:transparent;padding:6px 0;width:100%;
  display:flex;align-items:center;gap:8px;color:var(--muted);
  opacity:.5;transition:.18s
}
.insert-toggle:hover,.insert-toggle:focus-visible{opacity:1;color:var(--green)}
.insert-toggle:before,.insert-toggle:after{content:"";flex:1;height:1px;background:#d7dfd2}
.insert-toggle span{
  width:19px;height:19px;border-radius:50%;background:var(--paper);
  border:1px solid #c7d1bf;display:grid;place-items:center;
  font-size:12px;line-height:1;flex-shrink:0
}
.insert-row.open{margin:8px 0}
.insert-form{grid-template-columns:1fr 125px auto auto}
.text-input{
  min-width:0;width:100%;border:1px solid var(--line);
  border-radius:9px;background:var(--paper);padding:11px 12px;font-size:12px;outline:none
}
.text-input:focus{border-color:#799477}
.empty{font-size:13px;color:var(--muted);padding:28px;text-align:center}
footer{max-width:1208px;margin:36px auto 0;padding:22px 0 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;font-size:10px;color:var(--muted);letter-spacing:.4px}
@media(min-width:801px){footer{display:none}}
dialog{border:0;border-radius:16px;padding:0;background:#17281f;max-width:92vw;max-height:92vh}
dialog::backdrop{background:#101b16dd;backdrop-filter:blur(5px)}
.lightbox-inner{position:relative;padding:12px}
.lightbox-inner img{display:block;max-width:85vw;max-height:80vh;object-fit:contain;border-radius:8px}
.close-lightbox{position:absolute;top:20px;right:20px;border:0;border-radius:50%;background:#ffffffed;width:34px;height:34px;font-size:22px}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  padding:13px 20px;background:var(--green);color:#fff;border-radius:11px;
  box-shadow:0 8px 32px #0002;font-size:12px;z-index:50;
  max-width:90vw;width:max-content
}
.auth-form{display:grid;gap:12px;min-width:min(360px,80vw);padding:22px;background:#fffefaf2;border-radius:14px}
.auth-form h3{margin:0 0 4px;font-size:15px;font-weight:700}
.auth-form-actions{display:flex;justify-content:flex-end;gap:8px}
@media(min-width:1400px){.hero{min-height:108px}}
@media(max-width:800px){
  body{height:auto;overflow:auto}
  footer{display:none}
  .topbar{padding:14px 20px}
  .hero{width:calc(100% - 32px);margin:0 16px;padding:16px 30px;min-height:104px}
  .eyebrow{font-size:25px}
  .hero-bottom{gap:14px;flex-wrap:wrap}
  .layout{display:block;margin-top:20px;padding:0 20px}
  .sidebar{position:static}
  .nav-label,.side-note{display:none}
  .days{flex-direction:row;overflow-x:auto;padding:0 0 12px;gap:8px;scrollbar-width:thin}
  .day-btn{width:125px;flex-shrink:0;display:block;padding:12px}
  .day-date{font-size:14px}
  .day-date small{display:inline;margin-left:5px}
  .day-place{margin-top:7px;font-size:11px}
  .day-place small{display:none}
  .main{margin-top:23px}
  .main{height:auto;overflow:visible}
  .day-panel{height:auto;min-height:0;overflow:visible;margin-bottom:20px}
  .day-panel-scroll{height:auto;width:100%;margin:0;overflow:visible;padding:18px 14px 22px}
  .budget strong{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
  h2{font-size:26px}
  footer{margin:30px 20px 0;line-height:1.7;flex-direction:column}
}
@media(max-width:480px){
  .brand{font-size:18px}.brand small{font-size:8px}
  .top-actions .btn{padding:8px 10px;font-size:11px}
  .hero{padding:15px 24px;min-height:100px}
  .hero-bottom{gap:14px;font-size:11px}
  .layout{padding:0 16px}
  .day-head{gap:9px}
  h2{font-size:23px}.budget strong{font-size:19px}
  .step{grid-template-columns:27px minmax(0,1fr);gap:9px}
  .insert-row{grid-template-columns:27px minmax(0,1fr);gap:9px}
  .step-number{width:27px;height:27px;font-size:10px;margin-top:20px}
  .timeline:before{left:13px}
  .card-top{padding:16px 14px 12px;gap:5px}
  .edit-step-form{grid-template-columns:1fr 110px;padding:14px}
  .edit-step-form button{grid-column:auto}
  .card-actions{flex-direction:column;gap:0}
  .location-form{padding:0 14px 12px;flex-wrap:wrap}
  .location-form .text-input{flex-basis:100%}
  .step-title{font-size:14px}
  .tools summary{padding:11px 14px}
  .tool-body{padding:5px 14px 16px}
  .add-box{margin-left:36px;padding:15px}
  .add-form{grid-template-columns:1fr 95px}
  .add-form .primary{grid-column:1/-1}
  .insert-form{grid-template-columns:1fr 95px}
  .insert-form button{grid-column:1/-1}
  .photo-wrap{width:75px;height:67px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="background-layer active" id="backgroundA" aria-hidden="true"></div>
<div class="background-layer" id="backgroundB" aria-hidden="true"></div>
<header class="topbar">
  <img class="flag-mark" src="canada-flag.png" alt="加拿大国旗">
  <div class="auth-actions">
    <span class="auth-status" id="authStatus">浏览模式</span>
    <button class="btn" id="authBtn" type="button">登录</button>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</header>

<section class="hero">
  <div class="eyebrow">AUTUMN 2026 · WESTERN CANADA</div>
  <div class="hero-bottom">
    <span><b>09.23 — 10.03</b></span><i></i><span><b>11 天 / 9 晚</b></span><i></i>
    <span>全程 <b id="tripTotal">CAD$ 0.00 · CNY￥ 0.00</b></span>
    <span id="aaSummary" class="aa-summary"></span>
  </div>
</section>

<div class="layout">
  <aside class="sidebar">
    <div class="nav-label">THE ITINERARY / 每日行程</div>
    <nav id="days" class="days" aria-label="选择旅行日期"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<footer>
  <span>🍁 CANADA, ONE DAY AT A TIME.</span>
  <span id="storageStatus" role="status">正在读取本机数据…</span>
</footer>

<dialog id="lightbox" aria-label="照片预览">
  <div class="lightbox-inner">
    <img id="largePhoto" alt="旅行照片大图">
    <button class="close-lightbox" id="closeLightbox" aria-label="关闭照片">×</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<dialog id="authDialog" aria-label="Supabase 登录">
  <form class="auth-form" id="authForm">
    <h3>登录后编辑旅行记录</h3>
    <input class="text-input" name="email" type="email" placeholder="邮箱" required autocomplete="email">
    <input class="text-input" name="password" type="password" placeholder="密码" required autocomplete="current-password">
    <div class="auth-form-actions">
      <button class="btn primary" type="submit">登录</button>
      <button class="btn" type="button" id="closeAuth">取消</button>
    </div>
  </form>
</dialog>

<dialog id="passwordDialog" aria-label="设置密码">
  <form class="auth-form" id="passwordForm">
    <h3>设置登录密码</h3>
    <p class="auth-status">请设置一个密码，之后可在其他浏览器登录。</p>
    <input class="text-input" name="password" type="password" placeholder="新密码（至少 6 位）" minlength="6" required autocomplete="new-password">
    <input class="text-input" name="confirmPassword" type="password" placeholder="再次输入新密码" minlength="6" required autocomplete="new-password">
    <div class="auth-form-actions">
      <button class="btn primary" type="submit">保存密码</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const $ = s => document.querySelector(s);
const cloud = window.supabase.createClient(
  "https://eippujilwrsldicvqyqj.supabase.co",
  "sb_publishable_vooP4MLcYZ6W3LQWMRR6YQ_XC6fJ3E1"
);
let session = null;
const canEdit = () => Boolean(session);
function requireEditor(){
  if(canEdit()) return true;
  toast("请先登录后再编辑");
  $("#authDialog").showModal();
  return false;
}
function updateAuthUi(){
  $("#authStatus").textContent = session ? "已登录，可编辑" : "浏览模式";
  $("#authBtn").textContent = session ? "退出" : "登录";
}
const uid = () => globalThis.crypto?.randomUUID?.()
  || Date.now().toString(36) + Math.random().toString(36).slice(2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const money = (n, currency) => currency + Number(n || 0).toLocaleString("en-CA", {
  minimumFractionDigits:2, maximumFractionDigits:2
});
const step = (title, time = "", kind = "visit") => ({
  id:uid(), title, time, kind, costCad:0, costCny:0,
  aaCad:false, aaCny:false, payerCad:"", payerCny:"", photos:[], location:""
});
const stay = title => step(title, "", "stay");

function initialState(){
  return {
    version:1,
    selected:"0923",
    days:[
      {
        id:"0922", date:"9/22", week:"周二", city:"行前准备",
        en:"Trip Prep", routeCn:"行前准备", routeEn:"Trip Prep",
        route:"Trip Prep", note:"确认护照、签证、机票、保险与必备物品清单。",
        steps:[
          step("确认护照与签证信息"),
          step("确认机票、租车和接送安排"),
          step("准备电子设备与充电设备"),
          step("整理必需药品与应急联系人"),
          step("打包衣物与随身用品清单")
        ]
      },
      {
        id:"0923", date:"9/23", week:"周三", city:"温哥华",
        en:"Vancouver", routeCn:"温哥华", routeEn:"Vancouver", route:"Vancouver", note:"",
        steps:[
          step("抵达温哥华 · 国泰 CX303 / CX814","07:40","flight"),
          step("Gastown"),
          step("Waterfront / Canada Place"),
          step("Granville Island"),
          step("English Bay"),
          stay("2269 W 36th Ave · Vancouver 民宿")
        ]
      },
      {

const TRIP_YEAR = 2026;
function defaultDayId(){
  const now = new Date();
  const beijingCutoff = new Date(`${TRIP_YEAR}-09-23T00:00:00+08:00`);
  if(now < beijingCutoff) return "0923";
  const vancouverDate = new Intl.DateTimeFormat("en-CA", {
    timeZone:"America/Vancouver",
    year:"numeric", month:"2-digit", day:"2-digit"
  }).format(now);
  const [year, month, day] = vancouverDate.split("-").map(Number);
  if(year === TRIP_YEAR && month === 9 && day >= 23 && day <= 30)
    return `${String(month).padStart(2,"0")}${String(day).padStart(2,"0")}`;
  if(year === TRIP_YEAR && month === 10 && day === 1)
    return "1001";
  if(year === TRIP_YEAR && month === 10 && day === 2)
    return "1002";
  if(year === TRIP_YEAR && month === 10 && day === 3)
    return "1003";
  return "0923";
}

function updateStorageStatus(){
  $("#storageStatus").textContent = pendingPhotos
    ? "正在处理照片，请勿关闭页面…"
      : pendingWrites
      ? "正在保存，请勿关闭页面…"
      : storageError
        ? "本机保存不可用或失败，请导出备份"
        : "数据保存在当前浏览器 · 建议定期导出备份";
}

function openDatabase(){
  return new Promise((resolve,reject) => {
    if(!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const request = indexedDB.open("maple-canada-journal",1);
    request.onupgradeneeded = () => request.result.createObjectStore("journal");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function readState(){
  return new Promise((resolve,reject) => {
    const request = db.transaction("journal","readonly").objectStore("journal").get("trip");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function writeLocalState(){
  return new Promise((resolve,reject) => {
    if(!db) return reject(new Error("local database unavailable"));
    const transaction = db.transaction("journal","readwrite");
    transaction.objectStore("journal").put(state,"trip");
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error || new Error("local save aborted"));
  });
}

async function save(){
  pendingWrites++;
  updateStorageStatus();
  try{
    try{
      await writeLocalState();
    }catch(error){
      storageError = true;
      toast("本机备份保存失败，当前页面内容仍会在本次会话中保留");
    }
    if(!session) throw new Error("请先登录");
    const {error} = await cloud.from("trip_state").upsert({
      id:"trip", state, updated_by:session.user.id, updated_at:new Date().toISOString()
    });
    if(error) throw error;
    storageError = false;
    return true;
  }catch(error){
    storageError = true;
    toast(`云端保存失败：${error.message || "请确认已登录并完成 Supabase 权限设置"}`);
    return false;
  }finally{
    pendingWrites--;
    updateStorageStatus();
  }
}

/* 导入时仅接受本网站的数据结构，文本始终转义后显示。 */
function isValidPhotoValue(value){
  if(typeof value !== "string") return false;
  if(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=\s]+$/.test(value)) return true;
  if(/^\/photos\/[A-Za-z0-9_\/-]+\.(jpeg|jpg|png|webp)$/.test(value)) return true;
  try{
    const url = new URL(value);
    if((url.protocol === "http:" || url.protocol === "https:")
      && /\.(jpeg|jpg|png|webp)(?:$|\?)/i.test(url.pathname)) return true;
  }catch(error){
    return false;
  }
  return false;
}

function normalizeState(raw){
  if(!raw || raw.version !== 1 || !Array.isArray(raw.days))
    throw new Error("不是有效备份");
  const base = initialState();
  const baseIds = new Set(base.days.map(d => d?.id));
  const validDays = raw.days.filter(day => day && baseIds.has(day.id));
  if(validDays.length < 1) throw new Error("日期不完整");
  const ids = new Set(validDays.map(d => d?.id));
  if(ids.size !== validDays.length) throw new Error("日期重复");
  for(const day of base.days){
    const old = validDays.find(d => d?.id === day.id);
    if(!old || !Array.isArray(old.steps)) throw new Error("缺少行程");
    day.steps = old.steps.map(s => {
      if(!s || typeof s.title !== "string" || !s.title.trim()
        || typeof s.time !== "string"
        || (s.costCad !== undefined && (typeof s.costCad !== "number"
          || !Number.isFinite(s.costCad) || s.costCad < 0 || s.costCad > 1000000000))
        || (s.costCny !== undefined && (typeof s.costCny !== "number"
          || !Number.isFinite(s.costCny) || s.costCny < 0 || s.costCny > 1000000000))
        || (s.aaCad !== undefined && typeof s.aaCad !== "boolean")
        || (s.aaCny !== undefined && typeof s.aaCny !== "boolean")
        || (s.payerCad !== undefined && !["", "黄", "姚"].includes(s.payerCad))
        || (s.payerCny !== undefined && !["", "黄", "姚"].includes(s.payerCny))
        || !Array.isArray(s.photos)) throw new Error("行程格式错误");
      const hasCadAaData = s.aaCad !== undefined || s.payerCad !== undefined;
      const hasCnyAaData = s.aaCny !== undefined || s.payerCny !== undefined;
      const photos = s.photos.map(p => {
        if(!isValidPhotoValue(p)) throw new Error("照片格式錯誤");
        return p;
      });
      return {
        id:uid(),
        title:s.title.slice(0,240),
        time:s.time.slice(0,60),
        kind:["visit","stay","flight"].includes(s.kind) ? s.kind : "visit",
        costCad:Math.round(Number(s.costCad ?? s.cost ?? 0)*100)/100,
        costCny:Math.round(Number(s.costCny ?? 0)*100)/100,
        aaCad:hasCadAaData ? Boolean(s.aaCad) : Number(s.costCad ?? s.cost ?? 0) > 0,
        aaCny:hasCnyAaData ? Boolean(s.aaCny) : Number(s.costCny ?? 0) > 0,
        payerCad:(hasCadAaData ? s.aaCad : Number(s.costCad ?? s.cost ?? 0) > 0)
          ? (["黄","姚"].includes(s.payerCad) ? s.payerCad : "黄") : "",
        payerCny:(hasCnyAaData ? s.aaCny : Number(s.costCny ?? 0) > 0)
          ? (["黄","姚"].includes(s.payerCny) ? s.payerCny : "黄") : "",
        photos,
        location:typeof s.location === "string" ? s.location.slice(0,1000) : ""
      };
    });
    day.notes = Array.isArray(old.notes)
      ? old.notes.filter(note => typeof note === "string").map(note => note.slice(0,500))
      : old.note ? [String(old.note).slice(0,500)] : [];
  }
  base.selected = base.days.some(d => d.id === raw.selected) ? raw.selected : base.days[0].id;
  return base;
}

function summaryText(s){
  return [
    s.costCad > 0 ? `CAD$ ${money(s.costCad * (s.aaCad ? 0.5 : 1),"")}${s.aaCad ? " AA" : ""}` : "",
    s.costCny > 0 ? `CNY￥ ${money(s.costCny * (s.aaCny ? 0.5 : 1),"")}${s.aaCny ? " AA" : ""}` : "",
    s.photos.length ? `${s.photos.length} 张照片` : ""
  ].filter(Boolean).join(" · ") || "留下一点记录";
}

function googleMapsUrl(value){
  try{
    const url = new URL(value.trim());
    const host = url.hostname.toLowerCase();
    if(url.protocol !== "https:" || !(host === "maps.app.goo.gl"
      || host.endsWith("google.com") || host.endsWith("google.ca"))) return null;
    return url.href;
  }catch(error){
    return null;
  }
}

                <span class="tool-label">开销与照片</span>
                <span class="step-summary">${summaryText(s)}</span>
              </summary>
              <div class="tool-body">
                <div class="tool-controls">
                  <label>
                    <span class="field-label">本行程累计开销</span>
                    ${editor ? `<span class="cost-field">
                      <span>CAD$</span>
                      <input type="number" min="0" max="1000000000" step="0.01"
                        inputmode="decimal" data-cost="cad" value="${s.costCad || ""}"
                        placeholder="0.00" aria-label="本行程开销，加元">
                      ${aaControlHtml("cad", s, editor)}
                    </span>
                    <span class="cost-field">
                      <span>CNY￥</span>
                      <input type="number" min="0" max="1000000000" step="0.01"
                        inputmode="decimal" data-cost="cny" value="${s.costCny || ""}"
                        placeholder="0.00" aria-label="本行程开销，人民币">
                      ${aaControlHtml("cny", s, editor)}
                    </span>` : `<span class="step-summary">CAD$ ${money(s.costCad,"")} · CNY￥ ${money(s.costCny,"")}${s.aaCad || s.aaCny ? ` · ${aaControlHtml("cad", s, editor)}${aaControlHtml("cny", s, editor)}` : ""}</span>`}
                  </label>
                  ${editor ? `<button class="btn" data-action="upload">＋ 添加照片</button>
                  <input type="file" data-photos accept="image/*" multiple hidden>` : ""}
                </div>
                <div class="photos">
                  ${s.photos.map((p,j) => `
                    <div class="photo-wrap">
                      <button class="thumb" data-action="view-photo" data-index="${j}"
                        aria-label="查看第 ${j+1} 张照片">
                        <img src="${esc(p)}" alt="${esc(s.title)} · 照片 ${j+1}" loading="lazy">
                      </button>
                      ${editor ? `<button class="remove-photo" data-action="delete-photo" data-index="${j}"
                        aria-label="删除第 ${j+1} 张照片">×</button>` : ""}
                    </div>
                  `).join("")}
                </div>
              </div>
            </details>`}
          </div>
        </article>
        ${i < day.steps.length - 1 ? insertRowHtml(i+1) : ""}
      `).join("") : '<div class="empty">今天還沒有行程，添加第一站吧。</div>'}
      </div>
      ${insertRowHtml(day.steps.length)}
      </div>
    </section>
  `;
  $("#main").querySelectorAll("details").forEach(details => {
    details.addEventListener("toggle", () => {
      const id = details.closest("[data-id]").dataset.id;
      if(details.open) openCards.add(id);
      else openCards.delete(id);
    });
  });
  renderStats();
}

$("#days").addEventListener("click", event => {
  const button = event.target.closest("[data-day]");
  if(!button || !ready) return;
  const scroll = $("#days").scrollLeft;
  state.selected = button.dataset.day;
  insertAt = null;
  render();
  $("#days").scrollLeft = scroll;
});

$("#main").addEventListener("submit", event => {
  const form = event.target;
  if(!requireEditor()) return;
  if(form.id === "noteForm"){
    event.preventDefault();
    const note = form.elements.note.value.trim();
    if(!note) return;
    const day = currentDay();
    if(!Array.isArray(day.notes)) day.notes = day.note ? [day.note] : [];
    if(editingNoteIndex === day.notes.length) day.notes.push(note.slice(0,500));
    else day.notes[editingNoteIndex] = note.slice(0,500);
    editingNoteIndex = null;
    save();
    render();
    toast("注意事项已保存");
    return;
  }
  if(form.matches("[data-edit-step]")){
    event.preventDefault();
    const stepItem = currentDay().steps.find(item => item.id === form.dataset.editStep);
    if(!stepItem) return;
    const title = form.elements.title.value.trim();
    if(!title) return;
    stepItem.title = title.slice(0,240);
    stepItem.time = form.elements.time.value.trim().slice(0,60);
    editingStepId = null;
    save();
    render();
    toast("行程已修改");
    return;
  }
  if(form.matches("[data-location-step]")){
    event.preventDefault();
    const stepItem = currentDay().steps.find(item => item.id === form.dataset.locationStep);
    const location = googleMapsUrl(form.elements.location.value);
    if(!stepItem) return;
    if(!location){
      toast("请输入有效的 Google Maps 链接");
      return;
    }
    stepItem.location = location;
    editingLocationId = null;
    save();
    render();
    toast("位置已保存");
    return;
  }
  if(form.id === "addForm"){
    event.preventDefault();
    const title = form.elements.title.value.trim();
    const time = form.elements.time.value.trim();
    if(!title) return;
    currentDay().steps.push(step(title,time));
    save();
    render();
    $("#addForm").elements.title.focus();
    toast("已添加行程");
    return;
  }
  if(form.matches("[data-insert-index]")){
    event.preventDefault();
    const title = form.elements.title.value.trim();
    const time = form.elements.time.value.trim();
    if(!title) return;
    currentDay().steps.splice(Number(form.dataset.insertIndex),0,step(title,time));
    insertAt = null;
    save();
    render();
    toast("已插入行程");
  }
});

$("#main").addEventListener("click", event => {
  const button = event.target.closest("[data-action]");
  if(!button) return;
  const action = button.dataset.action;
  if(action === "view-photo" || action === "open-location") {
    if(action === "view-photo"){
      const article = button.closest("[data-id]");
      if(!article) return;
      const s = currentDay().steps.find(x => x.id === article.dataset.id);
      if(!s) return;
      const index = Number(button.dataset.index);
      if(!Number.isInteger(index) || index < 0 || index >= s.photos.length) return;
      $("#largePhoto").src = s.photos[index];
      $("#lightbox").showModal();
      return;
    }
    if(action === "open-location"){
      const article = button.closest("[data-id]");
      if(!article) return;
      const s = currentDay().steps.find(x => x.id === article.dataset.id);
      if(!s || !s.location) return;
      window.open(s.location,"_blank","noopener,noreferrer");
      return;
    }
  }
  if(!requireEditor()) return;

  if(action === "add-note"){
    const notes = currentDay().notes || [];
    editingNoteIndex = notes.length;
    render();
    $("#noteForm")?.elements.note.focus();
    return;
  }
  if(action === "edit-note"){
    editingNoteIndex = Number(button.dataset.noteIndex);
    render();
    $("#noteForm")?.elements.note.focus();
    return;
  }
  if(action === "cancel-note"){
    editingNoteIndex = null;
    render();
    return;
  }
  if(action === "cancel-edit"){
    editingStepId = null;
    render();
    return;
  }
  if(action === "cancel-location"){
    editingLocationId = null;
    render();
    return;
  }
  if(action === "delete-note"){
    const day = currentDay();
    if(!Array.isArray(day.notes)) day.notes = day.note ? [day.note] : [];
    day.notes.splice(Number(button.dataset.noteIndex),1);
    save();
    render();
    toast("注意事项已删除");
    return;
  }

  if(action === "open-insert"){
    insertAt = Number(button.dataset.index);
    render();
    $(`[data-insert-index="${insertAt}"]`)?.elements?.title?.focus();
    return;
  }
  if(action === "cancel-insert"){
    insertAt = null;
    render();
    return;
  }

  const article = button.closest("[data-id]");
  if(!article) return;
  const s = currentDay().steps.find(x => x.id === article.dataset.id);
  if(!s) return;
  const index = Number(button.dataset.index);

  if(action === "add-location" || action === "edit-location"){
    editingLocationId = s.id;
    render();
    $(`[data-location-step="${s.id}"]`)?.elements?.location?.focus();
    return;
  }
  if(action === "open-location"){
    window.open(s.location,"_blank","noopener,noreferrer");
    return;
  }

  if(action === "delete"){
    if(!confirm(`删除「${s.title}」？\n其开销和照片也会一并删除。`)) return;
    const day = currentDay();
    const stepIndex = day.steps.findIndex(item => item.id === s.id);
    day.steps = day.steps.filter(x => x.id !== s.id);
    openCards.delete(s.id);
    insertAt = null;
    save().then(saved => {
      if(!saved){
        day.steps.splice(stepIndex,0,s);
        render();
        return;
      }
      deleteStepFolder(day.id,s.id).catch(() => toast("照片文件删除失败，请检查服务器。"));
      render();
      toast("行程已删除");
    });
    return;
  }
  if(action === "edit"){
    editingStepId = s.id;
    render();
    $(`[data-edit-step="${s.id}"]`)?.elements?.title?.focus();
    return;
  }
  if(action === "upload") article.querySelector("[data-photos]").click();
  if(action === "view-photo"){
    $("#largePhoto").src = s.photos[index];
    $("#lightbox").showModal();
  }
  if(action === "delete-photo"){
    if(!confirm("删除这张照片？")) return;
    const photoPath = s.photos[index];
    deletePhotoFile(photoPath).catch(() => toast("照片文件删除失败，请检查服务器。"));
    s.photos.splice(index,1);
    openCards.add(s.id);
    save();
    render();
  }
});

$("#main").addEventListener("change", async event => {
  const input = event.target;
  const article = input.closest("[data-id]");
  if(!article) return;
  const day = currentDay();
  const s = day.steps.find(x => x.id === article.dataset.id);
  if(!s) return;
  if(!requireEditor()) return;

  if(input.matches("[data-cost]")){
    const number = Number(input.value);
    const field = input.dataset.cost === "cny" ? "costCny" : "costCad";
    if(!Number.isFinite(number) || number < 0 || number > 1000000000){
      input.value = s[field] || "";
      toast("请输入有效的非负金额");
      return;
    }
    s[field] = Math.round(number*100)/100;
    input.value = s[field] || "";
    article.querySelector(".step-summary").textContent = summaryText(s);
    renderStats();
    save();
  }

  if(input.matches("[data-aa]")){
    const currency = input.dataset.aa;
    const aaKey = currency === "cad" ? "aaCad" : "aaCny";
    const payerKey = currency === "cad" ? "payerCad" : "payerCny";
    s[aaKey] = input.checked;
    if(!input.checked){
      s[payerKey] = "";
      save();
    }else{
      toast("请选择 AA 由谁垫付");
    }
    render();
    return;
  }

  if(input.matches("[data-payer]")){
    const currency = input.dataset.payer;
    const payerKey = currency === "cad" ? "payerCad" : "payerCny";
    if(!["黄","姚"].includes(input.value)){
      toast("请选择黄或姚");
      return;
    }
    s[payerKey] = input.value;
    save();
    render();
    return;
  }

  if(input.matches("[data-photos]")){
    const files = Array.from(input.files || []);
    if(!files.length) return;
    pendingPhotos++;
    updateStorageStatus();
    const uploadButton = article.querySelector('[data-action="upload"]');
    uploadButton.disabled = true;
    uploadButton.textContent = "处理照片中…";
    let added = 0, failed = 0;
    try{
      for(const file of files){
        try{
          const photo = await compressPhoto(file);
          // 用户切换日期或删除行程时，避免把照片写进错误的行程。
          if(!state.days.includes(day) || !day.steps.includes(s)) break;
          s.photos.push(await uploadPhoto(day.id,s.id,photo));
          added++;
        }catch(error){
          failed++;
          if(error?.message) toast(`照片上传失败：${error.message}`);
        }
      }
      if(added){
        openCards.add(s.id);
        save();
      }
    }finally{
      pendingPhotos--;
      updateStorageStatus();
      render();
      toast(failed
        ? `已添加 ${added} 张；${failed} 张无法读取，请尝试 JPG、PNG 或 WebP。`
        : `已添加 ${added} 张照片`);
    }
  }
});

async function compressPhoto(file){
  if(file.size > 40 * 1024 * 1024) throw new Error("文件过大");
  const url = URL.createObjectURL(file);
  try{
    const image = await new Promise((resolve,reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = url;
    });
    const ratio = Math.min(1,1400 / Math.max(image.naturalWidth,image.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1,Math.round(image.naturalWidth*ratio));
    canvas.height = Math.max(1,Math.round(image.naturalHeight*ratio));
    const context = canvas.getContext("2d");
    if(!context) throw new Error("无法处理图片");
    context.fillStyle = "#ffffff";
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas.toDataURL("image/jpeg",0.82);
  }finally{
    URL.revokeObjectURL(url);
  }
}

async function uploadPhoto(dayId, stepId, data){
  if(!session) throw new Error("not signed in");
  const blob = await (await fetch(data)).blob();
  const path = `${dayId}/${stepId}/${crypto.randomUUID()}.jpg`;
  const {error} = await cloud.storage.from("trip-photos").upload(path,blob,{contentType:"image/jpeg",upsert:false});
  if(error) throw error;
  const {data:publicData} = cloud.storage.from("trip-photos").getPublicUrl(path);
  return publicData.publicUrl;
}

async function deletePhotoFile(path){
  if(!path.includes("/storage/v1/object/public/trip-photos/")) return;
  const storagePath = path.split("/storage/v1/object/public/trip-photos/")[1];
  await cloud.storage.from("trip-photos").remove([storagePath]);
}

async function deleteStepFolder(dayId, stepId){
  if(!session) return;
  const {data} = await cloud.from("trip_state").select("state").eq("id","trip").maybeSingle();
  const photos = data?.state?.days?.flatMap(day => day.steps || [])
    .find(stepItem => stepItem.id === stepId)?.photos || [];
  await Promise.all(photos.map(deletePhotoFile));
}

$("#closeLightbox").onclick = () => $("#lightbox").close();
$("#lightbox").addEventListener("click", event => {
  if(event.target === $("#lightbox")) $("#lightbox").close();
});
$("#lightbox").addEventListener("close", () => $("#largePhoto").removeAttribute("src"));

$("#exportBtn")?.addEventListener("click", () => {
  if(!ready) return;
  if(pendingPhotos) return toast("请等照片处理完成后再导出");
  const blob = new Blob([JSON.stringify(state)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `枫行-加拿大备份-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url),2000);
  toast("已发起备份下载，包含行程、开销和压缩照片");
});

$("#importBtn")?.addEventListener("click", () => {
  if(!ready) return;
  if(pendingPhotos) return toast("请等照片处理完成后再导入");
  $("#importFile").click();
});

$("#importFile").onchange = async event => {
  const file = event.target.files?.[0];
  if(!file) return;
  try{
    const imported = normalizeState(JSON.parse(await file.text()));
    if(pendingPhotos){
      toast("照片仍在处理中，请稍后重试");
      return;
    }
    if(!confirm("导入会覆盖当前浏览器里的全部旅行记录。\n建议先导出当前备份，确定继续吗？")) return;
    state = imported;
    openCards.clear();
    save();
    render();
    toast("备份已导入");
  }catch(error){
    toast("无法导入，请选择本网站导出的完整 JSON 备份。");
  }finally{
    event.target.value = "";
  }
};

window.addEventListener("beforeunload", event => {
  if(pendingPhotos || pendingWrites){
    event.preventDefault();
    event.returnValue = "";
  }
});

async function loadCloudState(){
  const {data,error} = await cloud.from("trip_state").select("state").eq("id","trip").maybeSingle();
  if(error) throw error;
  if(!data?.state) return false;
  const remote = normalizeState(data.state);
  const localBackup = await readState().catch(() => null);
  if(localBackup && JSON.stringify(localBackup) !== JSON.stringify(initialState())) {
    return false;
  }
  state = remote;
  return true;
}

function cloudErrorMessage(error){
  if(error?.code === "42501") return "当前账号没有行程访问权限，请确认已加入 trip_collaborators。";
  if(error?.message?.toLowerCase().includes("row-level security"))
    return "当前账号没有行程访问权限，请检查 Supabase RLS。";
  return `无法读取 Supabase 数据：${error?.message || "请检查项目配置"}`;
}

const authFlow = new URLSearchParams(location.hash.slice(1)).get("type");
const needsPasswordSetup = () => Boolean(session) && ["invite", "recovery"].includes(authFlow);
function clearAuthCallback(){
  history.replaceState(null, document.title, `${location.pathname}${location.search}`);
}

$("#passwordForm").onsubmit = async event => {
  event.preventDefault();
  if(!session){ toast("登录状态已失效，请重新打开邀请链接"); return; }
  const form = event.currentTarget;
  const password = form.elements.password.value;
  if(password !== form.elements.confirmPassword.value){
    toast("两次输入的密码不一致");
    return;
  }
  const button = form.querySelector("button[type=submit]");
  button.disabled = true;
  try{
    const {error} = await cloud.auth.updateUser({password});
    if(error) throw error;
    clearAuthCallback();
    $("#passwordDialog").close();
    toast("密码已设置，现在可以在其他浏览器登录");
  }catch(error){
    toast(`密码设置失败：${error.message || "请稍后重试"}`);
  }finally{
    button.disabled = false;
  }
};

$("#authBtn").onclick = async () => {
  if(session){
    await cloud.auth.signOut();
    session = null;
    updateAuthUi();
    render();
    return;
  }
  $("#authDialog").showModal();
  $("#authForm input[name=email]").focus();
};
$("#closeAuth").onclick = () => $("#authDialog").close();
$("#authForm").onsubmit = async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const {data,error} = await cloud.auth.signInWithPassword({
    email:form.elements.email.value.trim(),
    password:form.elements.password.value
  });
  if(error){ toast("登录失败，请检查邮箱和密码。"); return; }
  session = data.session;
  updateAuthUi();
  $("#authDialog").close();
  try{
    await loadCloudState();
    render();
    toast("登录成功，已读取云端行程");
  }catch(error){
    storageError = true;
    render();
    toast(cloudErrorMessage(error));
  }
};

async function boot(){
  $("#main").innerHTML = '<div class="empty">正在整理你的加拿大行程…</div>';
  try{
    const auth = await cloud.auth.getSession();
    session = auth.data.session;
    updateAuthUi();

    try{
      db = await openDatabase();
      const localState = await readState();
      if(localState) state = normalizeState(localState);
    }catch(error){
      db = null;
    }

    if(session){
      try{
        await loadCloudState();
      }catch(error){
        storageError = true;
        toast(cloudErrorMessage(error));
      }
    }
    if(!state?.days?.length) state = initialState();
    state.selected = defaultDayId();
  }catch(error){
    storageError = true;
    toast(cloudErrorMessage(error));
  }
  ready = true;
  render();
  updateStorageStatus();
  if(needsPasswordSetup()) $("#passwordDialog").showModal();
}
boot();
</script>
